# /etc/turnserver.conf – STUN/TURN of souldew Renaissance (deploy/README.md)
listening-port=3478
tls-listening-port=5349
external-ip=193.168.146.213
realm=souldew.pkmnrenaissance.com
server-name=souldew.pkmnrenaissance.com
fingerprint
lt-cred-mech
# the same password as `credential` in shared/edition.mjs
user=souldew:CHANGE_ME
min-port=49152
max-port=49252
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers
# never relay into private networks (the VPS's own services, its Docker containers)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# 8 players with room to spare
user-quota=24
total-quota=100
