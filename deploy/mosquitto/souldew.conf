# /etc/mosquitto/conf.d/souldew.conf – broker of souldew Renaissance (deploy/README.md)
# WebSocket, local only: nginx terminates TLS in front of it (wss://souldew.pkmnrenaissance.com/mqtt)
listener 9001 127.0.0.1
protocol websockets

# local access for tests and administration (mosquitto_sub / mosquitto_pub)
listener 1883 127.0.0.1

allow_anonymous true
acl_file /etc/mosquitto/souldew.acl

# runs (retained messages) survive restarts – persistence itself is on in Debian's mosquitto.conf
autosave_interval 60

max_connections 200
max_packet_size 262144
